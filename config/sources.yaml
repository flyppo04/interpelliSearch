# Fonti da controllare.
#   name:     nome mostrato sulla pagina (deve essere unico)
#   type:     rss  -> feed RSS. Siti WordPress (USP, scuole con tema "Design Scuole"):
#                     indirizzo del sito o della categoria + /feed/
#             html -> pagina qualsiasi: legge tutti i link, i filtri tengono quelli giusti
#   url:      indirizzo da leggere
#   province: sigla della provincia
#   pages:    solo feed WordPress: quante pagine leggere (ognuna ha 10 avvisi). Facoltativo, default 1
#   render:   true solo se la pagina mostra gli avvisi con JavaScript (facoltativo,
#             richiede Playwright: vedi README). Di solito si usa con type: html

